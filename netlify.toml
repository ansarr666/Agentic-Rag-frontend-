[build]
  command = "npm run build"
  publish = "dist"

# Pretty URL rewrites for multi-page entry points
[[redirects]]
  from = "/widget"
  to = "/widget.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/demo"
  to = "/demo.html"
  status = 200
